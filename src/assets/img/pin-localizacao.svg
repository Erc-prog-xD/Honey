<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="80" viewBox="0 0 64 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Sombra do Pin -->
  <ellipse cx="32" cy="76" rx="12" ry="4" fill="rgba(0,0,0,0.15)"/>
  
  <!-- Gradientes e Filtros -->
  <defs>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD280"/>
      <stop offset="50%" style="stop-color:#FFBD59"/>
      <stop offset="100%" style="stop-color:#E5A040"/>
    </linearGradient>
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5A2B"/>
      <stop offset="100%" style="stop-color:#5D3A1A"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Pin Principal -->
  <path d="M32 0C14.327 0 0 14.327 0 32C0 50.837 28.8 73.6 32 76C35.2 73.6 64 50.837 64 32C64 14.327 49.673 0 32 0Z" 
        fill="url(#pinGradient)" 
        filter="url(#dropShadow)"/>
  
  <!-- Círculo branco interno -->
  <circle cx="32" cy="28" r="18" fill="white"/>
  
  <!-- Colmeia / Caixa estilizada -->
  <g transform="translate(20, 14)">
    <!-- Teto da colmeia -->
    <path d="M-2 6 L12 0 L26 6 L24 8 L12 3 L0 8 Z" fill="url(#boxGradient)"/>
    
    <!-- Corpo da caixa -->
    <rect x="2" y="8" width="20" height="22" rx="2" fill="url(#boxGradient)"/>
    
    <!-- Ripas horizontais da caixa -->
    <rect x="2" y="11" width="20" height="2" fill="#F5A623" opacity="0.6"/>
    <rect x="2" y="17" width="20" height="2" fill="#F5A623" opacity="0.6"/>
    <rect x="2" y="23" width="20" height="2" fill="#F5A623" opacity="0.6"/>
    
    <!-- Entrada da colmeia -->
    <rect x="8" y="26" width="8" height="4" rx="1" fill="#2C1810"/>
  </g>
  
  <!-- Reflexo de luz no topo -->
  <ellipse cx="24" cy="12" rx="8" ry="4" fill="rgba(255,255,255,0.35)"/>
</svg>